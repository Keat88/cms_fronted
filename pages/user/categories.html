<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories - Connectly</title>
  <script src="../../assets/js/theme.js"></script>
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235B7CFA'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='2.5'/%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/d-dash.css">
  <link rel="stylesheet" href="../../assets/css/u-category.css">
</head>

<body>

  <div class="app-shell">

    <!-- ================= SIDEBAR (Offcanvas on Mobile, Fixed on Desktop) ================= -->
    <div id="sidebar-container"></div>


    <!-- ================= MAIN CONTENT ================= -->
    <main class="app-main">

      <!-- Top Navbar -->
      <nav class="topbar px-3 px-md-4 py-2">
        <div class="d-flex justify-content-between align-items-center gap-2">

          <div class="d-flex align-items-center gap-2">
            <button class="icon-btn d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu"
              aria-controls="sidebarMenu" aria-label="Open menu">
              <i class="bi bi-list fs-5"></i>
            </button>

            <div class="breadcrumb-text d-none d-sm-flex align-items-center gap-1">
              <span class="text-muted-custom">Personal workspace</span>
              <i class="bi bi-chevron-right"></i>
              <span class="text-white">Categories</span>
            </div>
            <div class="fw-semibold d-sm-none">Categories</div>
          </div>

          <div class="d-flex align-items-center gap-2 gap-md-3">
            <div class="search-box d-none d-md-flex">
              <i class="bi bi-search"></i>
              <input type="text" placeholder="Search contacts...">
            </div>

            <span class="date-text d-none d-sm-block">Thu, Nov 5, 2026</span>

            <button type="button" class="icon-btn theme-toggle" data-theme="dark" aria-label="Switch to light theme"
              title="Switch to light theme">
              <i class="bi bi-moon theme-icon-dark"></i>
              <i class="bi bi-sun theme-icon-light"></i>
            </button>

            <button class="icon-btn position-relative" aria-label="Notifications">
              <i class="bi bi-bell"></i>
              <span class="notif-dot"></span>
            </button>

            <div class="avatar avatar-sm avatar-info">AM</div>
          </div>
        </div>
      </nav>

      <!-- Categories Container -->
      <div class="container-fluid p-3 p-md-4">

        <!-- Page Header -->
        <div
          class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-3 mb-4">
          <div>
            <h3 class="page-title mb-1">Categories</h3>
            <p class="text-muted-custom mb-0 small">A little organization for every kind of connection. 8 categories,
              endless possibilities.</p>
          </div>
          <a href="create-categoires.html" class="btn-primary-glow" type="button"><i class="bi bi-plus-lg"></i> Create
            category</a>
        </div>

        <!-- Global Search -->
        <div class="search-box w-100 mb-4">
          <i class="bi bi-search"></i>
          <input type="text" placeholder="Search categories..." aria-label="Search categories">
        </div>

        <!-- Split Layout: Grid (Left) and Side Panels (Right) -->
        <div class="row g-4 mb-4">
          <div class="row g-3" id="categories_data">
          </div>
        </div>

        <!-- Footer Actions -->
        <div
          class="d-flex flex-column flex-sm-row justify-content-between align-items-center pt-3 border-top border-custom mt-2 gap-3">
          <span class="text-muted-custom small mb-0">
            Contacts can belong to multiple categories. Deleting a category never deletes its contacts.
          </span>
          <button type="button" class="btn-danger-custom d-flex align-items-center px-4 py-2">
            <i class="bi bi-trash me-2"></i> Delete category
          </button>
        </div>

      </div>
    </main>
  </div>
  <script type="module">
    import { categoriesData } from "../../assets/js/mockU.js";
    import { renderSidebar } from '../../assets/js/sidebar.js';
    renderSidebar();
    const categories = document.getElementById("categories_data");
    const fetchCategories = () => {
      categories.innerHTML = categoriesData.map(i => `
    <div class="col-12 col-md-6 col-xl-3">
      <div class="card p-3 h-100 category-card ${i.active ? 'active' : ''} d-flex flex-column">
        <div class="d-flex justify-content-between align-items-start mb-3">
          <div class="folder-icon ${i.folderClass}"><i class="bi bi-folder"></i></div>
          <i class="bi bi-three-dots text-muted-custom cursor-pointer hover-white"></i>
        </div>
        <h6 class="fw-semibold text-white mb-1">${i.title}</h6>
        <p class="contact-role mb-4">${i.description}</p>
        <div class="mt-auto d-flex justify-content-between align-items-center">
          <span class="contact-time">${i.contactsCount}</span>
          ${i.active ? '<i class="bi bi-check-circle text-primary fs-5"></i>' : ''}
        </div>
      </div>
    </div>
  `).join('');
    };
    fetchCategories();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
